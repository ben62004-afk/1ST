<style>
:root{

  --equip:#8d857e; --equip-soft:#cfc7bf;

  --prime:#e0523a; --syn:#e3902b; --stab:#3f88c5; --accent:#2b2724;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1917; --panel:#25221f; --ink:#f0ebe5; --muted:#a59c93; --line:#3a3530;
    --idle:#3d3732; --idle-stroke:#5a524a; --skin:#3a342f; --skin-stroke:#665c52;
    --equip:#a39a91; --equip-soft:#4c453f;
    --hot:#ff6a4d; --con:#ff6a4d; --ecc:#a988f0; --iso:#5aa6e6;
    --prime:#ff6a4d; --syn:#f0a548; --stab:#5aa6e6; --accent:#f0ebe5;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1917; --panel:#25221f; --ink:#f0ebe5; --muted:#a59c93; --line:#3a3530;
  --idle:#3d3732; --idle-stroke:#5a524a; --skin:#3a342f; --skin-stroke:#665c52;
  --equip:#a39a91; --equip-soft:#4c453f;
  --hot:#ff6a4d; --con:#ff6a4d; --ecc:#a988f0; --iso:#5aa6e6;
  --prime:#ff6a4d; --syn:#f0a548; --stab:#5aa6e6; --accent:#f0ebe5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}

header p{margin:0;color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 16px}
.tab{
  font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 18px;border-radius:999px;cursor:pointer;font-weight:500;transition:.15s;
}
.tab small{color:var(--muted);margin-left:6px;font-size:.78em}
.tab[aria-selected="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}

svg{display:block;width:100%;height:auto}

.m.hl{stroke:var(--ink);stroke-width:2}

tr.mrow:hover,tr.mrow.hl{background:color-mix(in oklab,var(--hot) 8%,transparent)}
.mname b{font-weight:700}

  <section class="card" style="margin-top:16px">
    <h2>參與肌群 <span class="sub">即時數值隨動畫更新</span></h2>
    <div class="scroll">
      <table>
        <thead><tr><th>肌肉</th><th>角色</th><th style="width:22%">即時動用</th><th>收縮型態</th><th class="hide-sm" style="width:16%">肌肉長度</th></tr></thead>

  <p class="note">說明：動用程度為依常見 EMG 研究趨勢整理的相對示意值（0–100%），非個人實測數據；實際動用會因握距、軌跡、負重與個人結構而改變。側面圖為 2D 簡化模型，肌肉以起點至止點的連線表示，長度變化依關節角度即時計算。</p>
</div>
<div id="tip"></div>

<script>
(function(){
"use strict";
/* ---------- 向量工具 ---------- */
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y), norm=a=>{const l=len(a)||1;return V(a.x/l,a.y/l);};
const dot=(a,b)=>a.x*b.x+a.y*b.y;
const dir=d=>{const r=d*Math.PI/180;return V(Math.cos(r),Math.sin(r));};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f1=n=>n.toFixed(1);
const UA=58, FA=55, TL=105; // 上臂、前臂、軀幹長度

/* 兩段式反向運動學：給肩與目標手位置，求肘位置 */
function ik(S,target,pref){
  let d=sub(target,S), D=len(d);
  const max=UA+FA-0.5;
  if(D>max){d=mul(norm(d),max);D=max;}
  const W=add(S,d);
  const a=Math.atan2(d.y,d.x);
  const al=Math.acos(clamp((UA*UA+D*D-FA*FA)/(2*UA*D),-1,1));
  const e1=add(S,mul(V(Math.cos(a+al),Math.sin(a+al)),UA));
  const e2=add(S,mul(V(Math.cos(a-al),Math.sin(a-al)),UA));
  const E=dot(sub(e1,S),pref)>=dot(sub(e2,S),pref)?e1:e2;
  return {E,W};
}
function makePose(o){
  const u=dir(o.tor), n=V(-u.y,u.x);          // u: 髖→肩, n: 身體前側
  const S0=add(o.H,mul(u,TL));
  const S=add(S0,add(mul(u,o.sh.u),mul(n,o.sh.n))); // 肩胛移動造成的肩關節位移
  const {E,W}=ik(S,o.hand(S,S0),o.pref);
  return Object.assign({u,n,S0,S,E,W},o);
}

/* ---------- 肌肉資料 ---------- */
const MUS={
  lats:{n:"背闊肌",en:"Latissimus dorsi"},
  teres:{n:"大圓肌",en:"Teres major"},
  trap_u:{n:"上斜方肌",en:"Upper trapezius"},
  trap_m:{n:"中斜方肌",en:"Middle trapezius"},
  trap_l:{n:"下斜方肌",en:"Lower trapezius"},
  rhomb:{n:"菱形肌（深層）",en:"Rhomboids"},
  delt_a:{n:"前三角肌",en:"Anterior deltoid"},
  delt_p:{n:"後三角肌",en:"Posterior deltoid"},
  infra:{n:"棘下肌",en:"Infraspinatus"},
  pec_c:{n:"胸大肌（鎖骨部）",en:"Pec major, clavicular"},
  pec_s:{n:"胸大肌（胸肋部）",en:"Pec major, sternocostal"},
  serratus:{n:"前鋸肌",en:"Serratus anterior"},
  biceps:{n:"肱二頭肌",en:"Biceps brachii"},
  brachialis:{n:"肱肌",en:"Brachialis"},
  brachiorad:{n:"肱橈肌",en:"Brachioradialis"},
  forearm_f:{n:"前臂屈肌群（握力）",en:"Forearm flexors"},
  forearm_e:{n:"前臂伸肌群",en:"Forearm extensors"},
  triceps:{n:"肱三頭肌",en:"Triceps brachii"},
  rectus:{n:"腹直肌",en:"Rectus abdominis"},
  obliques:{n:"腹斜肌",en:"Obliques"},
  erector:{n:"豎脊肌",en:"Erector spinae"}
};

/* 側面圖中每條肌肉的起點→止點（依當前姿勢計算） */
function frame(P){
  const T=(f,o)=>add(add(P.H,mul(P.u,f*TL)),mul(P.n,o));
  const ua=norm(sub(P.E,P.S)), uf=norm(sub(P.W,P.E));
  let pa=V(-ua.y,ua.x); if(dot(pa,P.pref)>0) pa=mul(pa,-1);   // 上臂屈側
  let pf=V(-uf.y,uf.x); if(dot(pf,P.pref)>0) pf=mul(pf,-1);   // 前臂屈側
  const Ar=(f,o)=>add(add(P.S,mul(ua,f*UA)),mul(pa,o));
  const scap=add(add(P.S,mul(P.u,-20)),mul(P.n,-13));          // 肩胛骨內緣代表點
  return {T,Ar,ua,uf,pa,pf,scap};
}
const BAND={
  lats:(P,F)=>[F.T(0.28,-15),F.Ar(0.22,0)],
  teres:(P,F)=>[F.T(0.72,-16),F.Ar(0.24,0)],
  pec_s:(P,F)=>[F.T(0.74,19),F.Ar(0.32,0)],
  pec_c:(P,F)=>[F.T(0.97,10),F.Ar(0.28,0)],
  delt_a:(P,F)=>[F.T(1.02,7),F.Ar(0.45,0)],
  delt_p:(P,F)=>[F.T(1.0,-10),F.Ar(0.45,0)],
  infra:(P,F)=>[F.scap,F.Ar(0.08,-3)],
  trap_m:(P,F)=>[F.T(0.80,-22),F.scap],
  rhomb:(P,F)=>[F.T(0.74,-21),F.scap],
  trap_l:(P,F)=>[F.T(0.45,-20),F.scap],
  serratus:(P,F)=>[F.T(0.60,12),F.scap],
  biceps:(P,F)=>[F.Ar(0.12,5),add(add(P.E,mul(F.uf,10)),mul(F.pf,4))],
  brachialis:(P,F)=>[F.Ar(0.52,4),add(add(P.E,mul(F.uf,8)),mul(F.pf,3))],
  brachiorad:(P,F)=>[F.Ar(0.76,-1),add(P.E,mul(F.uf,48))],
  forearm_f:(P,F)=>[add(add(P.E,mul(F.uf,4)),mul(F.pf,3)),add(add(P.E,mul(F.uf,50)),mul(F.pf,2))],
  triceps:(P,F)=>[F.Ar(0.06,-6),add(add(P.E,mul(F.uf,-7)),mul(F.pa,-2))],
  rectus:(P,F)=>[F.T(0.10,13),F.T(0.80,14)],
  obliques:(P,F)=>[F.T(0.12,10),F.T(0.62,15)],

/* 預先取樣每條肌肉長度範圍（決定性計算） */
function bandLen(ex,id,p){const P=ex.pose(clamp(p,0,1));const [a,b]=BAND[id](P,frame(P));return len(sub(b,a));}
for(const k in EX){
  const ex=EX[k]; ex.range={};
  ex.muscles.forEach(([id])=>{
    if(!BAND[id]) return;
    let mn=1e9,mx=-1e9;
    for(let i=0;i<=40;i++){const l=bandLen(ex,id,i/40);mn=Math.min(mn,l);mx=Math.max(mx,l);}
    ex.range[id]=[mn,mx];
  });
}

/* ---------- 時間軸：向心 / 頂峰停頓 / 離心 / 底部停頓 ---------- */
const SEG=[{k:"con",d:1.4},{k:"top",d:0.5},{k:"ecc",d:2.0},{k:"bot",d:0.5}];
const TOTAL=SEG.reduce((s,x)=>s+x.d,0);
const ease=x=>0.5-0.5*Math.cos(Math.PI*x);
function phaseAt(t){
  t=((t%TOTAL)+TOTAL)%TOTAL; let acc=0;
  for(const s of SEG){
    if(t<acc+s.d||s===SEG[SEG.length-1]){
      const l=clamp((t-acc)/s.d,0,1);
      const p=s.k==="con"?ease(l):s.k==="top"?1:s.k==="ecc"?1-ease(l):0;
      const sign=s.k==="con"?1:s.k==="ecc"?-1:0;
      return {k:s.k,l,p,sign};
    }
    acc+=s.d;
  }
}
const PH_COLOR={con:"var(--con)",top:"var(--iso)",ecc:"var(--ecc)",bot:"var(--iso)"};
const PH_NAME={con:"向心期",top:"頂峰停頓",ecc:"離心期",bot:"底部停頓"};
const ROLE_COLOR={"主動肌":"var(--prime)","協同肌":"var(--syn)","穩定肌":"var(--stab)"};
const TYPE={con:{t:"向心收縮",c:"var(--con)"},ecc:{t:"離心收縮",c:"var(--ecc)"},iso:{t:"等長收縮",c:"var(--iso)"},stab:{t:"等長穩定",c:"var(--iso)"},dyn:{t:"動態穩定",c:"var(--iso)"}};

function contraction(ex,id,role,ph){
  if(!BAND[id]) return "iso";
  const d=(bandLen(ex,id,ph.p+0.01)-bandLen(ex,id,ph.p-0.01))/0.02; // dL/dp
  const moving=Math.abs(d)>3;
  if(role==="穩定肌") return moving&&ph.sign!==0?"dyn":"stab";
  if(ph.sign===0||!moving) return "iso";
  return ph.sign*d<0?"con":"ecc";
}
function targetAct(peak,role,ph){
  if(role==="穩定肌") return peak*(ph.sign===0?0.75:0.9);
  return peak*({con:1,top:0.85,ecc:0.72,bot:0.3})[ph.k];
}

function mirror(svgId,gid){
  const g=document.getElementById(gid), m=document.createElementNS("http://www.w3.org/2000/svg","g");
  m.setAttribute("transform","translate(200 0) scale(-1 1)");
  [...g.children].forEach(c=>m.appendChild(c.cloneNode(true)));
  g.parentNode.insertBefore(m,g.nextSibling);
}

function seg(a,b,w,cls){
  return `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke="var(--skin-stroke)" stroke-width="${w+2}" stroke-linecap="round"/>`+
         `<line x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}" stroke="var(--skin)" stroke-width="${w}" stroke-linecap="round"/>`;
}
function drawBody(P){
  const pts=[add(P.H,mul(P.n,15)),add(P.S0,mul(P.n,18)),add(P.S0,mul(P.n,-16)),add(P.H,mul(P.n,-15))];
  const torso=`<path d="M${pts.map(q=>f1(q.x)+","+f1(q.y)).join(" L")} Z" fill="var(--skin)" stroke="var(--skin-stroke)" stroke-width="1.5" stroke-linejoin="round"/>`;
  const head=add(add(P.S0,mul(P.u,30)),mul(P.n,4));
  return seg(P.H,P.K,22)+seg(P.K,P.A,15)+seg(P.A,add(P.A,mul(P.foot,17)),8)+
    `<circle cx="${f1(P.H.x)}" cy="${f1(P.H.y)}" r="16" fill="var(--skin)" stroke="var(--skin-stroke)" stroke-width="1.5"/>`+
    torso+seg(P.S0,add(P.S0,mul(P.u,16)),10)+
    `<circle cx="${f1(head.x)}" cy="${f1(head.y)}" r="13" fill="var(--skin)" stroke="var(--skin-stroke)" stroke-width="1.5"/>`+
    seg(P.S,P.E,14)+seg(P.E,P.W,11)+
    `<circle cx="${f1(P.S.x)}" cy="${f1(P.S.y)}" r="8" fill="var(--skin)" stroke="var(--skin-stroke)"/>`+
    `<circle cx="${f1(P.W.x)}" cy="${f1(P.W.y)}" r="6" fill="var(--skin)" stroke="var(--skin-stroke)"/>`;
}

function setHover(id){
  state.hover=id;
  document.querySelectorAll(".m,.mrow").forEach(el=>el.classList.toggle("hl",!!id&&el.dataset.m===id));

function render(dt){
  const ex=EX[state.ex], ph=phaseAt(state.t), P=ex.pose(ph.p), F=frame(P);
  const eq=ex.equip(P,ph.p);
  $("#equipBack").innerHTML=eq.back;
  $("#bodyG").innerHTML=drawBody(P);
  $("#equipFront").innerHTML=eq.front;

  let bands="";
  const info={};
  ex.muscles.forEach(([id,role,peak])=>{
    const tgt=targetAct(peak,role,ph);
    const prev=state.act[id]??tgt;
    const a=dt>0?prev+(tgt-prev)*Math.min(1,dt*6):tgt;
    state.act[id]=a;
    const type=contraction(ex,id,role,ph);
    let lenPct=null;
    if(BAND[id]){
      const [p1,p2]=BAND[id](P,F), L=len(sub(p2,p1)), [mn,mx]=ex.range[id];
      lenPct=mx-mn>1?(L-mn)/(mx-mn):0.5;
      const shorten=1+(1-lenPct)*0.6*(mx-mn>1?1:0);
      const w=clamp((1.6+a*5.2)*shorten,1.5,11);
      const col=TYPE[type].c;
      const hl=state.hover===id;
      const xy=`x1="${f1(p1.x)}" y1="${f1(p1.y)}" x2="${f1(p2.x)}" y2="${f1(p2.y)}"`;
      if(hl) bands+=`<line ${xy} stroke="var(--ink)" stroke-width="${f1(w+5)}" stroke-linecap="round" opacity=".35"/>`;
      bands+=`<line ${xy} data-m="${id}" stroke="${col}" stroke-width="${f1(w)}" stroke-linecap="round" opacity="${f1(hl?1:0.35+a*0.6)}"/>`;
    }
    info[id]={a,type,lenPct,role};
  });
  $("#bandG").innerHTML=bands;

  // 解剖圖上色
  ex.muscles.forEach(([id])=>{
    const pct=Math.round(info[id].a*100);
    document.querySelectorAll(`#front .m[data-m="${id}"],#back .m[data-m="${id}"]`).forEach(el=>{
      el.style.fill=`color-mix(in oklab, var(--hot) ${pct}%, var(--idle))`;
    });
    const b=document.querySelector(`[data-bar="${id}"]`); if(b) b.style.width=pct+"%";
    const c=document.querySelector(`[data-chip="${id}"]`);
    if(c){const T=TYPE[info[id].type]; c.textContent=T.t; c.style.color=T.c;}
    const l=document.querySelector(`[data-len="${id}"]`);
    if(l) l.style.width=info[id].lenPct==null?"0%":Math.round(15+info[id].lenPct*85)+"%";
  });
  state.info=info;

  const tt=((state.t%TOTAL)+TOTAL)%TOTAL;
  $("#cursor").style.left=(tt/TOTAL*100)+"%";
  if(state.playing) $("#scrub").value=Math.round(tt/TOTAL*1000);
  const pill=$("#phasePill"); pill.textContent=PH_NAME[ph.k]; pill.style.color=PH_COLOR[ph.k];
  $("#phaseDesc").textContent=ex[ph.k];
}

});

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state.playing){state.t+=dt*state.speed;render(dt);}
  requestAnimationFrame(loop);
}
buildStatic(); render(0); requestAnimationFrame(loop);

/* 供測試使用的唯讀介面 */
window.__muscleModel={EX,BAND,phaseAt,contraction,bandLen,TOTAL};
})();
</script>
